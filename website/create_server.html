<!DOCTYPE html>
<html lang="en">
   <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Timespan increaser</title>

      <link rel="stylesheet" href="./server.css" defer>
   </head>
   <body>
      <div id=hudcontainer>
         <nav><a href="/" id="leaveb">Leave</a></nav>
         <div class="codebox">
            <span id="codetext">{{pincode}}</span>
            <button type="button" id="copybtn">Copy</button>
         </div>
      </div>
      <div id=maincontainer>
         <div id="scrollcontainer">
            <!--
               <form method="post" action="/choose">
               <button type="button" class="scrollchoice">instagram reels</button>
               <button type="button" class="scrollchoice">tiktok</button>
               <button type="button" class="scrollchoice">youtube shorts</button>
               </form>
            -->
            {{scrollchoice}}
         </div>
      </div>
   </body>

   <script>
      const choices = document.getElementById('scrollcontainer');
      const maincontainer = document.getElementById('maincontainer');

      choices.addEventListener('click', (e) => {
         const btn = e.target.closest('.scrollchoice');
         if (!btn) return;

         maincontainer.style.opacity = 1;
         choices.hidden = true;
      });

      const codetext = document.getElementById('codetext');
      const copybtn = document.getElementById('copybtn');

      copybtn.addEventListener('click', async () => {
         try {
            await navigator.clipboard.writeText(codetext.textContent);
            copybtn.textContent = 'Copied!';
            setTimeout(() => { copybtn.textContent = 'Copy'; }, 1500);
         } catch {
            copybtn.textContent = 'Failed';
            setTimeout(() => { copybtn.textContent = 'Copy'; }, 1500);
         }
      });
   </script>

</html>
